<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GoClaw</title>
  <script>
    // Paint the saved theme (or the OS setting for "system") before first paint
    // so neither theme flashes the other.
    try {
      const stored = JSON.parse(localStorage.getItem('goclaw-ui') || '{}')
      const pref = stored.state && stored.state.theme
      const dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.classList.toggle('dark', dark)
    } catch {}
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
