apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.slave.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    role: slave
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "postgresql.slave.selectorLabels" . | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
      name: postgresql
