apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgresql.haproxy.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    {{- include "postgresql.haproxy.selectorLabels" . | nindent 4 }}
  annotations:
    description: "Single entry point for PostgreSQL - Use this for all PostgreSQL connections"
spec:
  type: ClusterIP
  selector:
    {{- include "postgresql.haproxy.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.haproxy.service.primaryPort }}
      targetPort: {{ .Values.haproxy.service.primaryPort }}
      name: postgresql-primary
    - port: {{ .Values.haproxy.service.readonlyPort }}
      targetPort: {{ .Values.haproxy.service.readonlyPort }}
      name: postgresql-readonly
    - port: {{ .Values.haproxy.stats.port }}
      targetPort: {{ .Values.haproxy.stats.port }}
      name: stats
