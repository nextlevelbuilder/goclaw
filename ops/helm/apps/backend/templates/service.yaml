apiVersion: v1
kind: Service
metadata:
  name: {{ include "nilclaw.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nilclaw.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: gateway
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort.enabled }}
      nodePort: {{ .Values.service.nodePort.port }}
      {{- end }}
  selector:
    {{- include "nilclaw.selectorLabels" . | nindent 4 }}
