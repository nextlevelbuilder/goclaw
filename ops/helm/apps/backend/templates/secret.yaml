{{- if eq (include "nilclaw.secret.inline.enabled" .) "true" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nilclaw.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "nilclaw.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.auth.openaiApiKey }}
  {{ include "nilclaw.secret.key.openaiApiKey" . }}: {{ include "nilclaw.secret.value.openaiApiKey" . | quote }}
  {{- end }}
  {{- if .Values.auth.anthropicApiKey }}
  {{ include "nilclaw.secret.key.anthropicApiKey" . }}: {{ include "nilclaw.secret.value.anthropicApiKey" . | quote }}
  {{- end }}
  {{- if .Values.auth.databaseUrl }}
  {{ include "nilclaw.secret.key.databaseUrl" . }}: {{ include "nilclaw.secret.value.databaseUrl" . | quote }}
  {{- end }}
  {{- if .Values.auth.redisUrl }}
  {{ include "nilclaw.secret.key.redisUrl" . }}: {{ include "nilclaw.secret.value.redisUrl" . | quote }}
  {{- end }}
{{- end }}
