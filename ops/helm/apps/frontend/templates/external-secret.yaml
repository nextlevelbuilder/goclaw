{{- if and (eq (include "portal.secret.mode" .) "externalSecret") .Values.secret.externalSecret.enabled }}
{{- $secretName := include "portal.secretName" . -}}
{{- $targetName := default $secretName .Values.secret.externalSecret.target.name -}}
{{- if ne $secretName $targetName }}
{{- fail "portal secret.externalSecret.target.name must match secret.name" }}
{{- end }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ include "portal.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "portal.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secret.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    kind: {{ .Values.secret.externalSecret.secretStoreRef.kind | quote }}
    name: {{ .Values.secret.externalSecret.secretStoreRef.name | quote }}
  target:
    name: {{ $secretName | quote }}
    creationPolicy: {{ .Values.secret.externalSecret.creationPolicy | quote }}
    deletionPolicy: {{ .Values.secret.externalSecret.deletionPolicy | quote }}
    template:
      type: {{ .Values.secret.externalSecret.target.templateType | quote }}
  {{- if .Values.secret.externalSecret.data }}
  data:
    {{- toYaml .Values.secret.externalSecret.data | nindent 4 }}
  {{- else }}
  data: []
  {{- end }}
{{- end }}
