# Self-service overlay — adds web dashboard UI (nginx + React SPA).
#
# Recommended usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.selfservice.yml up -d --build
#
# Dashboard: http://localhost:3000

services:
  goclaw-ui:
    build:
      context: ./ui/web
      dockerfile: Dockerfile
      args:
        VITE_BRAND_APP_NAME: "${VITE_BRAND_APP_NAME:-GoClaw}"
        VITE_BRAND_APP_KEY: "${VITE_BRAND_APP_KEY:-goclaw}"
        VITE_BRAND_TAGLINE: "${VITE_BRAND_TAGLINE:-}"
        VITE_BRAND_LOGO_URL: "${VITE_BRAND_LOGO_URL:-}"
    ports:
      - "${GOCLAW_UI_PORT:-3000}:80"
    networks:
      - default
      - shared
    depends_on:
      - goclaw
    restart: unless-stopped
